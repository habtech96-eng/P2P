<section class="mines-wrapper">
  <!-- HERO / HEADER SECTION -->
  <div class="mines-hero">
    <div class="mines-display">
      <span class="animated-icon">💣</span>
    </div>
    <h2>MINES ARENA</h2>
    <p>Find Diamonds & Avoid the Bombs!</p>
  </div>

  <!-- 5x5 MINES GRID -->
  <div id="mines-grid" class="mines-grid-container">
    <!-- Grid tiles will be injected dynamically via JS -->
  </div>

  <!-- BET & CONFIG FORM -->
  <div class="form-group mt-16">
    <label class="section-label">1. CHOOSE STAKE (ETB)</label>
    <div class="chip-grid">
      <button type="button" class="mines-chip-btn active" data-amount="10">10 ETB</button>
      <button type="button" class="mines-chip-btn" data-amount="50">50 ETB</button>
      <button type="button" class="mines-chip-btn" data-amount="100">100 ETB</button>
      <button type="button" class="mines-chip-btn" data-amount="500">500 ETB</button>
    </div>
  </div>

  <div class="form-group">
    <label class="section-label">2. NUMBER OF MINES 💣</label>
    <select id="mines-count-select" class="custom-select">
      <option value="1">1 Mine (Low Risk)</option>
      <option value="3" selected>3 Mines (Recommended)</option>
      <option value="5">5 Mines (Medium Risk)</option>
      <option value="10">10 Mines (High Risk)</option>
    </select>
  </div>

  <!-- STATS BOARD -->
  <div class="mines-stats-card">
    <div class="stat-box">
      <span>Next Multiplier</span>
      <strong id="mines-next-mult">1.00x</strong>
    </div>
    <div class="stat-box">
      <span>Current Profit</span>
      <strong id="mines-profit" class="text-green">0 ETB</strong>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <button id="start-mines-btn" class="mines-action-btn" type="button">
    <span>💣 START GAME</span>
  </button>

  <button id="cashout-mines-btn" class="cashout-action-btn hidden" type="button" disabled>
    <span>💰 CASHOUT (<span id="mines-cashout-val">0</span> ETB)</span>
  </button>

  <p class="secure-text">🔒 100% Provably Fair Random System</p>
</section>
